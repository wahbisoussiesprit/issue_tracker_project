<div class="mx-auto max-w-md px-4 py-10">
  <div class="card p-6">
    <h3 class="text-center text-xl font-semibold mb-4 dark:text-white">Create account</h3>
    <form (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="block text-sm mb-1">Username</label>
        <input class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" [(ngModel)]="username" name="username" required>
      </div>
      <div>
        <label class="block text-sm mb-1">Email</label>
        <input type="email" class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" [(ngModel)]="email" name="email" required>
      </div>
      <div>
        <label class="block text-sm mb-1">Password</label>
        <input type="password" class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" [(ngModel)]="password" name="password" required>
      </div>
      <div>
        <label class="block text-sm mb-1">Role (optional)</label>
        <input class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2" [(ngModel)]="role" name="role" placeholder="ADMIN or USER">
      </div>
      <div *ngIf="error" class="rounded-md bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 px-3 py-2 text-sm">{{ error }}</div>
      <button class="btn-primary w-full" type="submit" [disabled]="loading">
        {{ loading ? 'Creating...' : 'Register' }}
      </button>
    </form>
  </div>
</div>
