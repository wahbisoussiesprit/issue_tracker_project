<div class="container mt-5" style="max-width: 520px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h3 class="mb-3 text-center">Create account</h3>
      <form (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input class="form-control" [(ngModel)]="username" name="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="email" name="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" [(ngModel)]="password" name="password" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Role (optional)</label>
          <input class="form-control" [(ngModel)]="role" name="role" placeholder="ADMIN or USER">
        </div>
        <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>
        <button class="btn btn-success w-100" type="submit" [disabled]="loading">
          {{ loading ? 'Creating...' : 'Register' }}
        </button>
      </form>
    </div>
  </div>
</div>
