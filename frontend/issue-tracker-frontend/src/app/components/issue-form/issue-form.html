<div class="container mt-4">
  <h2>Create Issue</h2>
  <form (ngSubmit)="submit()">
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input class="form-control" [(ngModel)]="issue.title" name="title" required>
    </div>
    <div class="mb-3">
      <label>Description</label>
      <textarea class="form-control" [(ngModel)]="issue.description" name="description"></textarea>
    </div>
    <button type="submit" class="btn btn-success">Save</button>
  </form>
</div>
