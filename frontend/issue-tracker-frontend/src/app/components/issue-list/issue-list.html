<div class="mx-auto max-w-7xl px-4 py-6">
  <div class="flex flex-col md:flex-row md:items-center gap-3 mb-4">
    <h2 class="text-xl font-semibold">Issues</h2>
    <div class="md:ml-auto flex flex-wrap items-center gap-2">
      <input class="rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2"
             placeholder="Search issues..." [(ngModel)]="search" name="search">
      <select class="rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2"
              [(ngModel)]="statusFilter" name="statusFilter">
        <option value="">All Statuses</option>
        <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
      </select>
      <select class="rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2"
              [(ngModel)]="priorityFilter" name="priorityFilter">
        <option value="">All Priorities</option>
        <option *ngFor="let p of priorities" [value]="p">{{ p }}</option>
      </select>
      <button class="rounded-md border border-neutral-300 dark:border-neutral-700 px-3 py-2" (click)="showFilters = true">Filters</button>
      <button class="btn-primary" (click)="openCreate()">New Issue</button>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <div *ngFor="let issue of filteredIssues" class="card p-4 group">
      <div class="flex items-start justify-between gap-3">
        <h3 class="font-semibold leading-snug">{{ issue.title }}</h3>
        <div class="flex gap-2">
          <span class="px-2 py-0.5 rounded-full text-xs" [ngClass]="{
            'bg-status-success/10 text-status-success border border-status-success/30': issue.status==='CLOSED',
            'bg-status-warning/10 text-status-warning border border-status-warning/30': issue.status==='IN_PROGRESS',
            'bg-highlight-info text-primary border border-primary/20': issue.status==='OPEN'
          }">{{ issue.status }}</span>
          <span class="px-2 py-0.5 rounded-full text-xs" [ngClass]="{
            'bg-green-500/10 text-green-600 border border-green-500/30': issue.priority==='LOW',
            'bg-orange-500/10 text-orange-600 border border-orange-500/30': issue.priority==='MEDIUM',
            'bg-red-500/10 text-red-600 border border-red-500/30': issue.priority==='HIGH'
          }">{{ issue.priority }}</span>
        </div>
      </div>

      <div class="mt-3 flex items-center justify-between">
        <div class="flex items-center gap-2 text-sm text-neutral-600 dark:text-neutral-400">
          <div class="h-7 w-7 rounded-full bg-primary/10 text-primary flex items-center justify-center text-xs font-semibold">
            {{ assigneeInitials(issue) }}
          </div>
          <span>{{ assigneeName(issue) }}</span>
        </div>
        <div class="text-xs" [ngClass]="{ 'text-red-600': isOverdue(issue), 'text-neutral-500': !isOverdue(issue) }">
          {{ dueDateText(issue) }}
        </div>
      </div>

      <div class="mt-2 flex flex-wrap gap-1">
        <span *ngFor="let t of tagList(issue)" class="px-2 py-0.5 rounded-full text-[11px] bg-primary/10 text-primary border border-primary/20">#{{ t }}</span>
      </div>

      <div *ngIf="auth.isAuthenticated">
        <ng-container *ngIf="auth.isAdmin; else userControls">
          <div class="mt-3 flex items-center gap-2">
            <button class="rounded-md border border-neutral-300 dark:border-neutral-700 px-2 py-1 text-sm" (click)="openEdit(issue)">Edit</button>
            <select class="rounded-md border border-neutral-300 dark:border-neutral-700 px-2 py-1 text-sm" [(ngModel)]="issue.status" name="status_inline_{{issue.id}}" (change)="saveEdit(issue.id!)">
              <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
            </select>
            <button class="rounded-md bg-red-500 text-white px-2 py-1 text-sm hover:bg-red-600" (click)="deleteIssue(issue.id!)">Delete</button>
          </div>
        </ng-container>
        <ng-template #userControls>
          <div class="mt-3 flex items-center gap-2">
            <select class="rounded-md border border-neutral-300 dark:border-neutral-700 px-2 py-1 text-sm" [(ngModel)]="issue.status" name="status_inline_{{issue.id}}" (change)="saveEdit(issue.id!)">
              <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
            </select>
          </div>
        </ng-template>
      </div>
    </div>
  </div>

  <!-- Slide-in drawer for create/edit -->
  <div *ngIf="showDrawer" class="fixed inset-0 z-50">
    <div class="absolute inset-0 bg-black/40" (click)="closeDrawer()"></div>
    <div class="absolute right-0 top-0 h-full w-full max-w-md bg-[var(--surface)] border-l border-neutral-200/60 dark:border-neutral-800 p-5 overflow-auto">
      <h3 class="text-lg font-semibold mb-3">{{ draft?.id ? 'Edit Issue' : 'Create Issue' }}</h3>
      <form (ngSubmit)="saveDraft()" (keydown.control.enter)="saveDraft()" class="space-y-3">
        <div>
          <label class="block text-sm mb-1">Title</label>
          <input class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2" [(ngModel)]="draft!.title" name="d_title" required>
        </div>
        <div>
          <label class="block text-sm mb-1">Description</label>
          <textarea rows="4" class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2" [(ngModel)]="draft!.description" name="d_desc"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm mb-1">Status</label>
            <select class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2" [(ngModel)]="draft!.status" name="d_status">
              <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
            </select>
          </div>
          <div>
            <label class="block text-sm mb-1">Priority</label>
            <select class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2" [(ngModel)]="draft!.priority" name="d_priority">
              <option *ngFor="let p of priorities" [value]="p">{{ p }}</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm mb-1">Due Date</label>
            <input type="date" class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2" [(ngModel)]="draft!.dueDate" name="d_due">
          </div>
          <div>
            <label class="block text-sm mb-1">Tags (comma-separated)</label>
            <input class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2" [(ngModel)]="draft!.tags" name="d_tags" placeholder="bug, ui, api">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm mb-1">Project</label>
            <select class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2" [(ngModel)]="draft!.projectId" name="d_project">
              <option *ngFor="let p of projects" [value]="p.id">{{ p.name }}</option>
            </select>
          </div>
          <div>
            <label class="block text-sm mb-1">Assign To</label>
            <select class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2" [(ngModel)]="draft!.assignedTo" name="d_assigned">
              <option *ngFor="let u of users" [value]="u.id">{{ u.username }}</option>
            </select>
          </div>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" class="rounded-md border border-neutral-300 dark:border-neutral-700 px-3 py-2" (click)="closeDrawer()">Cancel (Esc)</button>
          <button type="submit" class="btn-primary">Save (Ctrl+Enter)</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Advanced Filters Drawer -->
  <div *ngIf="showFilters" class="fixed inset-0 z-40">
    <div class="absolute inset-0 bg-black/40" (click)="showFilters=false"></div>
    <div class="absolute left-0 top-0 h-full w-full max-w-md bg-[var(--surface)] border-r border-neutral-200/60 dark:border-neutral-800 p-5 overflow-auto">
      <h3 class="text-lg font-semibold mb-3">Filters</h3>
      <div class="space-y-3">
        <div>
          <label class="block text-sm mb-1">Assignee</label>
          <select class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2" [(ngModel)]="assigneeId" name="f_assignee">
            <option [ngValue]="undefined">Any</option>
            <option *ngFor="let u of users" [ngValue]="u.id">{{ u.username }}</option>
          </select>
        </div>
        <div>
          <label class="block text-sm mb-1">Project</label>
          <select class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2" [(ngModel)]="projectId" name="f_project">
            <option [ngValue]="undefined">Any</option>
            <option *ngFor="let p of projects" [ngValue]="p.id">{{ p.name }}</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm mb-1">From</label>
            <input type="date" class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2" [(ngModel)]="fromDate" name="f_from">
          </div>
          <div>
            <label class="block text-sm mb-1">To</label>
            <input type="date" class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2" [(ngModel)]="toDate" name="f_to">
          </div>
        </div>
        <div>
          <label class="block text-sm mb-1">Tags</label>
          <input class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2" [(ngModel)]="tagsFilter" name="f_tags" placeholder="bug, ui, api">
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-4">
        <button class="rounded-md border border-neutral-300 dark:border-neutral-700 px-3 py-2" (click)="showFilters=false">Close</button>
        <button class="btn-primary" (click)="applyFilters()">Apply</button>
      </div>
    </div>
  </div>

  <!-- Pagination Controls -->
  <div class="mt-6 flex items-center justify-center gap-3">
    <button class="rounded-md border border-neutral-300 dark:border-neutral-700 px-3 py-1" [disabled]="page===0" (click)="prevPage()">Prev</button>
    <span class="text-sm">Page {{ page + 1 }} / {{ totalPages || 1 }}</span>
    <button class="rounded-md border border-neutral-300 dark:border-neutral-700 px-3 py-1" [disabled]="page+1>=totalPages" (click)="nextPage()">Next</button>
  </div>
  <!-- Simple toast -->
  <div *ngIf="toast" class="fixed bottom-4 right-4 z-50 rounded-lg bg-neutral-900 text-white px-4 py-2 shadow-card">{{ toast }}</div>
</div>
