<div class="container mt-4">
  <h2 class="text-xl font-semibold mb-4">Projects</h2>

  <form (ngSubmit)="add()" class="mb-4">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
      <input class="rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2" [(ngModel)]="name" name="name" placeholder="Name" required>
      <input class="rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2 md:col-span-2" [(ngModel)]="description" name="description" placeholder="Description">
      <div class="flex gap-2">
        <input type="number" class="flex-1 rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-3 py-2" [(ngModel)]="createdById" name="createdById" placeholder="Creator ID">
        <button class="btn-primary" type="submit">Add</button>
      </div>
    </div>
  </form>

  <div class="overflow-x-auto rounded-xl border border-neutral-200/60 dark:border-neutral-800">
    <table class="min-w-full text-sm">
      <thead class="bg-neutral-100 dark:bg-neutral-900">
        <tr class="text-left">
          <th class="px-4 py-2">ID</th>
          <th class="px-4 py-2">Name</th>
          <th class="px-4 py-2">Description</th>
          <th class="px-4 py-2">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of projects" class="border-t border-neutral-200/60 dark:border-neutral-800">
          <td class="px-4 py-2">{{ p.id }}</td>
          <td class="px-4 py-2">
            <ng-container *ngIf="editId !== p.id; else editNameTpl">{{ p.name }}</ng-container>
            <ng-template #editNameTpl>
              <input class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-2 py-1" [(ngModel)]="editName" name="editName_{{p.id}}">
            </ng-template>
          </td>
          <td class="px-4 py-2">
            <ng-container *ngIf="editId !== p.id; else editDescTpl">{{ p.description }}</ng-container>
            <ng-template #editDescTpl>
              <input class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 px-2 py-1" [(ngModel)]="editDescription" name="editDescription_{{p.id}}">
            </ng-template>
          </td>
          <td class="px-4 py-2">
            <div class="flex gap-2">
              <ng-container *ngIf="editId !== p.id; else editActionsTpl">
                <button class="rounded-md border border-neutral-300 dark:border-neutral-700 px-3 py-1" (click)="startEdit(p)">Edit</button>
                <button class="rounded-md bg-red-500 text-white px-3 py-1 hover:bg-red-600" (click)="remove(p.id!)">Delete</button>
              </ng-container>
              <ng-template #editActionsTpl>
                <button class="rounded-md bg-green-600 text-white px-3 py-1 hover:bg-green-700" (click)="saveEdit(p.id!)">Save</button>
                <button class="rounded-md border border-neutral-300 dark:border-neutral-700 px-3 py-1" (click)="cancelEdit()">Cancel</button>
              </ng-template>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
